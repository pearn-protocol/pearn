[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# paris: no PUSH0/MCOPY opcodes, the safe target for Aurora's engine.
evm_version = "paris"
optimizer = true
optimizer_runs = 10_000
via_ir = false
# Fork tests need the Aurora RPC proxy; run them with FOUNDRY_PROFILE=fork.
no_match_path = "test/fork/*"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
  "aurora-sdk/=lib/aurora-contracts-sdk/aurora-solidity-sdk/src/",
]

[profile.fork]
match_path = "test/fork/*"
no_match_path = "none"

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 5_000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[lint]
# Windows here are hours to days; a validator's few seconds of timestamp drift cannot matter.
exclude_lints = ["block-timestamp"]

# Foundry's fork requests need the local proxy (scripts/aurora-rpc.mjs): Aurora rejects a bare
# block hash. `pnpm rpc:testnet` / `pnpm rpc:mainnet` start it on these ports.
[rpc_endpoints]
aurora = "http://127.0.0.1:8547"
aurora_testnet = "http://127.0.0.1:8546"

# Contracts are verified on Aurora's Blockscout explorers (Etherscan does not index Aurora):
# forge verify-contract --verifier blockscout --verifier-url https://explorer.testnet.aurora.dev/api/ ...
