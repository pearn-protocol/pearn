<!doctype html>
<html data-resolution="landscape" lang="en" >
	<head>
		<meta charset="UTF-8" />
		<meta content="width=1920, height=1080" name="viewport" />
		<title>Pearn hook</title>
		<script src="assets/gsap.min.js"></script>
		<style>
			:root {
				--bg: #ffffff;
				--ink: #0d0d0d;
				--muted: #5f5f5f;
				--pill: #f3f3f3;
				--line: #e6e6e6;
				--orange: #fe835a;
				--grad: linear-gradient(100deg, #fe835a, #f26b8a 55%, #9aa4e6);
			}
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 1920px;
				height: 1080px;
				overflow: hidden;
				background: var(--bg);
			}
			#root {
				position: relative;
				width: 100%;
				height: 100%;
				font-family: "Inter", sans-serif;
				color: var(--ink);
				background: var(--bg);
			}
			.scene {
				position: absolute;
				inset: 0;
				overflow: hidden;
			}
			.head {
				position: absolute;
				left: 0;
				right: 0;
				top: 500px;
				text-align: center;
				font-size: 68px;
				font-weight: 700;
				letter-spacing: -0.035em;
			}
			.sub {
				position: absolute;
				left: 0;
				right: 0;
				text-align: center;
				font-size: 40px;
				font-weight: 400;
				color: var(--muted);
				letter-spacing: -0.02em;
			}
			/* the bar everything is typed into */
			.bar {
				position: absolute;
				left: 410px;
				width: 1100px;
				display: flex;
				align-items: flex-end;
				gap: 22px;
			}
			.plus {
				width: 76px;
				height: 76px;
				border-radius: 50%;
				border: 2px solid var(--line);
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 44px;
				font-weight: 300;
				color: #555;
				flex: none;
			}
			.field {
				flex: 1;
				background: var(--pill);
				border-radius: 40px;
				padding: 18px 18px 18px 36px;
				display: flex;
				flex-direction: column;
				gap: 14px;
			}
			.row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 20px;
				min-height: 52px;
			}
			.text {
				font-size: 34px;
				font-weight: 500;
				letter-spacing: -0.02em;
				white-space: nowrap;
			}
			.text b {
				font-weight: 700;
			}
			.send {
				width: 56px;
				height: 56px;
				border-radius: 50%;
				background: var(--ink);
				color: #fff;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 30px;
				flex: none;
			}
			.chip {
				display: inline-flex;
				align-items: center;
				gap: 12px;
				align-self: flex-start;
				padding: 10px 20px;
				border-radius: 999px;
				background: #fff;
				font-size: 28px;
				font-weight: 500;
				color: #2a63d4;
			}
			.chip i {
				width: 18px;
				height: 18px;
				border-radius: 50%;
				background: currentColor;
				display: inline-block;
			}
			.chip.orange {
				color: #b8481a;
			}
			.shot {
				position: absolute;
				border-radius: 28px;
				box-shadow: 0 30px 80px rgba(0, 0, 0, 0.18);
			}
			.pills {
				position: absolute;
				left: 0;
				right: 0;
				display: flex;
				justify-content: center;
				gap: 28px;
			}
			.pillnote {
				display: inline-flex;
				align-items: center;
				gap: 14px;
				padding: 18px 30px;
				border-radius: 999px;
				background: var(--pill);
				font-size: 32px;
				font-weight: 500;
				white-space: nowrap;
			}
			.ok {
				width: 30px;
				height: 30px;
				border-radius: 50%;
				background: var(--orange);
				color: #0b0806;
				font-size: 20px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
			}
			/* rolling topics */
			#s6-roll {
				position: absolute;
				left: 350px;
				top: 330px;
				width: 420px;
				height: 420px;
				overflow: hidden;
				-webkit-mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent);
				mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent);
			}
			#s6-list {
				position: absolute;
				right: 0;
				top: 0;
				display: flex;
				flex-direction: column;
				align-items: flex-end;
			}
			#s6-list .chip {
				height: 84px;
				margin: 0;
				align-self: flex-end;
				font-size: 36px;
				background: var(--pill);
				color: #b8481a;
			}
			#s6-list div {
				height: 84px;
				display: flex;
				align-items: center;
			}
			#s6-on {
				position: absolute;
				left: 795px;
				top: 497px;
				font-size: 68px;
				font-weight: 700;
				letter-spacing: -0.035em;
			}
			#s7-logo {
				position: absolute;
				left: 900px;
				top: 330px;
				width: 120px;
				height: 120px;
			}
		</style>
	</head>
	<body>
		<div
			data-composition-id="main"
			data-duration="30"
			data-height="1080"
			data-start="0"
			data-width="1920"
			id="root"
		>
			<!-- s1: a real question is typed, Polymarket attaches, the real market answers -->
			<div class="scene clip" data-duration="7" data-start="0" data-track-index="0" data-track-kind="graphics" id="s1" >
				<div class="bar" id="s1-bar" style="top: 470px">
					<div class="plus">+</div>
					<div class="field">
						<div class="chip" id="s1-chip" ><i></i>Polymarket</div>
						<div class="row">
							<span class="text" id="s1-text"></span>
							<span class="send">↑</span>
						</div>
					</div>
				</div>
				<img alt="" class="shot" id="s1-card" src="assets/card-btc.png" style="left: 653px; top: 390px; width: 612px; height: 421px" />
			</div>

			<!-- s2 -->
			<div class="scene clip" data-duration="2.6" data-start="7" data-track-index="0" data-track-kind="graphics" id="s2" >
				<div class="head" id="s2-t"></div>
			</div>

			<!-- s3: the bet is typed -->
			<div class="scene clip" data-duration="5" data-start="9.6" data-track-index="0" data-track-kind="graphics" id="s3" >
				<div class="bar" id="s3-bar" style="top: 470px">
					<div class="plus">+</div>
					<div class="field">
						<div class="chip orange" id="s3-chip" ><i></i>Bitcoin $150k by 2027</div>
						<div class="row">
							<span class="text" id="s3-text"></span>
							<span class="send" id="s3-send">↑</span>
						</div>
					</div>
				</div>
				<div class="pills" style="top: 700px"><div class="pillnote" id="s3-done" ><span class="ok">✓</span>0.1 stNEAR staked on Yes</div></div>
			</div>

			<!-- s4 -->
			<div class="scene clip" data-duration="2.9" data-start="14.6" data-track-index="0" data-track-kind="graphics" id="s4" >
				<div class="head" id="s4-t"></div>
			</div>

			<!-- s5 -->
			<div class="scene clip" data-duration="4.7" data-start="17.5" data-track-index="0" data-track-kind="graphics" id="s5" >
				<div class="head" id="s5-t" style="top: 360px"></div>
				<div class="sub" id="s5-s" style="top: 470px">Winners split the staking yield.</div>
				<div class="pills" style="top: 620px">
					<div class="pillnote" id="s5-lose" ><span class="ok" style="background: #5f5f5f; color: #fff">✓</span>Lose: 0.1 stNEAR back</div>
					<div class="pillnote" id="s5-win" ><span class="ok">✓</span>Win: 0.1 stNEAR + yield</div>
				</div>
			</div>

			<!-- s6: topics roll beside "markets on Pearn" -->
			<div class="scene clip" data-duration="4.4" data-start="22.2" data-track-index="0" data-track-kind="graphics" id="s6" >
				<div id="s6-roll">
					<div id="s6-list">
						<div><span class="chip"><i></i>Crypto</span></div>
						<div><span class="chip"><i></i>Sports</span></div>
						<div><span class="chip"><i></i>Economy</span></div>
						<div><span class="chip"><i></i>World</span></div>
						<div><span class="chip"><i></i>Culture</span></div>
						<div><span class="chip"><i></i>Politics</span></div>
						<div><span class="chip"><i></i>Science</span></div>
						<div><span class="chip"><i></i>Anything</span></div>
					</div>
				</div>
				<div id="s6-on">markets on Pearn</div>
			</div>

			<!-- s7: end card -->
			<div class="scene clip" data-duration="3.4" data-start="26.6" data-track-index="0" data-track-kind="graphics" id="s7" >
				<img alt="" id="s7-logo" src="assets/logo.png" />
				<div class="head" id="s7-t" style="top: 490px">No-loss prediction markets.</div>
				<div class="sub" id="s7-s" style="top: 600px">On NEAR · <b style="color: var(--ink)">app.pearn.site</b></div>
			</div>

			<!-- music from the first frame; no voice: the type tells it (X autoplays muted) -->
			<audio data-duration="22" data-fade-in="0.4" data-start="0" data-track-index="5" data-volume="0.42" id="bed-a" src="assets/audio/bed2.mp3" ></audio>
			<audio data-duration="9" data-fade-in="1" data-fade-out="1.5" data-media-start="6" data-start="21" data-track-index="6" data-volume="0.42" id="bed-b" src="assets/audio/bed2.mp3" ></audio>
			<audio data-duration="2" data-fade-out="0.2" data-start="0.4" data-track-index="7" data-volume="0.7" id="fx-t1" src="assets/audio/type.mp3" ></audio>
			<audio data-duration="1.1" data-fade-out="0.2" data-media-start="0.3" data-start="7.2" data-track-index="7" data-volume="0.7" id="fx-t2" src="assets/audio/type.mp3" ></audio>
			<audio data-duration="1.2" data-fade-out="0.2" data-media-start="0.6" data-start="10.4" data-track-index="7" data-volume="0.7" id="fx-t3" src="assets/audio/type.mp3" ></audio>
			<audio data-duration="0.9" data-fade-out="0.2" data-media-start="0.2" data-start="14.8" data-track-index="7" data-volume="0.7" id="fx-t4" src="assets/audio/type.mp3" ></audio>
			<audio data-duration="0.48" data-start="3.0" data-track-index="8" data-volume="2.5" id="fx-pop1" src="assets/audio/pop.mp3" ></audio>
			<audio data-duration="0.48" data-start="12.5" data-track-index="8" data-volume="2.5" id="fx-pop2" src="assets/audio/pop.mp3" ></audio>
			<audio data-duration="0.68" data-start="3.6" data-track-index="9" data-volume="0.3" id="fx-w" src="assets/audio/whoosh2.mp3" ></audio>
			<audio data-duration="2.48" data-start="26.75" data-track-index="9" data-volume="0.5" id="fx-hit" src="assets/audio/impact.mp3" ></audio>
		</div>
		<script>
			const tl = gsap.timeline({ paused: true });
			const E = "power3.out";

			/** Types `text` into `#id` from `at` over `d` seconds; a function of time, so it seeks. */
			const type = (id, text, at, d) => {
				const p = { n: 0 };
				tl.fromTo(
					p,
					{ n: 0 },
					{
						n: text.length,
						duration: d,
						ease: "none",
						onUpdate: () => {
							document.getElementById(id).textContent = text.slice(0, Math.round(p.n));
						},
					},
					at,
				);
			};
			const pop = (sel, at) =>
				tl.fromTo(sel, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, at);
			const fadeUp = (sel, at, y = 24) =>
				tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: 0.5, ease: E }, at);

			// s1
			type("s1-text", "Will Bitcoin hit $150k by September 30, 2027?", 0.4, 2.2);
			tl.fromTo("#s1-chip", { opacity: 0, height: 0, scale: 0.8 }, { opacity: 1, height: 52, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 3.0);
			tl.fromTo("#s1-bar", { y: 0 }, { y: -300, duration: 0.6, ease: "power3.inOut" }, 3.6);
			tl.fromTo("#s1-card", { opacity: 0, y: 120, scale: 1.15 }, { opacity: 1, y: 40, scale: 1.25, duration: 0.7, ease: E }, 3.8);

			// s2
			type("s2-t", "Bet on real questions.", 7.15, 1.0);

			// s3
			tl.fromTo("#s3-bar", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 9.6);
			tl.fromTo("#s3-chip", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 9.9);
			type("s3-text", "Bet Yes · 0.1 stNEAR", 10.4, 1.1);
			tl.fromTo("#s3-send", { scale: 1 }, { scale: 0.82, duration: 0.12, ease: "power2.in", yoyo: true, repeat: 1 }, 12.0);
			tl.fromTo("#s3-bar", { y: 0 }, { y: -90, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 12.2);
			tl.fromTo("#s3-done", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 12.45);

			// s4
			type("s4-t", "And if you lose?", 14.8, 0.8);

			// s5
			type("s5-t", "You get your stake back.", 17.6, 1.1);
			fadeUp("#s5-s", 19.0);
			tl.fromTo("#s5-lose", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 19.7);
			tl.fromTo("#s5-win", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 20.1);

			// s6: the list steps one topic every 0.5 s, centred in the mask
			fadeUp("#s6-on", 22.3, 16);
			fadeUp("#s6-roll", 22.3, 16);
			for (let i = 0; i < 7; i++) {
				tl.fromTo("#s6-list", { y: 168 - i * 84 }, { y: 168 - (i + 1) * 84, duration: 0.32, ease: "power3.inOut", immediateRender: i === 0 }, 22.5 + i * 0.5);
			}

			// s7
			pop("#s7-logo", 26.7);
			fadeUp("#s7-t", 27.0);
			fadeUp("#s7-s", 27.5, 16);

			window.__timelines = window.__timelines || {};
			window.__timelines.main = tl;
		</script>
	</body>
</html>
