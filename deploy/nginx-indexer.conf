# Host nginx on the VPS (/etc/nginx/sites-available/indexer.pearn.103.150.190.91.sslip.io):
# TLS and the proxy to the indexer container on loopback 3178. Same privacy rules as
# nginx.conf: no access log, error log discarded, no client IP forwarded.

server {
    listen 80;
    listen [::]:80;
    server_name indexer.pearn.103.150.190.91.sslip.io;
    access_log off;
    error_log /dev/null crit;
    location /.well-known/acme-challenge/ { root /home/cuyvps/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name indexer.pearn.103.150.190.91.sslip.io;
    ssl_certificate     /home/cuyvps/le/config/live/indexer.pearn.103.150.190.91.sslip.io/fullchain.pem;
    ssl_certificate_key /home/cuyvps/le/config/live/indexer.pearn.103.150.190.91.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    # GraphQL and SQL queries are small POST bodies.
    client_max_body_size 16k;

    location /.well-known/acme-challenge/ { root /home/cuyvps/acme; }
    location / {
        proxy_pass http://127.0.0.1:3178;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }
}
