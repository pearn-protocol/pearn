# Host nginx on the VPS (/etc/nginx/sites-available/pearn.103.150.190.91.sslip.io). The box
# fronts every Coolify app with nginx + certbot instead of Traefik; Coolify publishes the web
# container on loopback 3177 only. TLS: Let's Encrypt via certbot webroot (/home/cuyvps/acme),
# renewed by the user's cron. No access log, error log discarded, no client IP forwarded.

server {
    listen 80;
    listen [::]:80;
    server_name pearn.103.150.190.91.sslip.io;
    access_log off;
    error_log /dev/null crit;
    location /.well-known/acme-challenge/ { root /home/cuyvps/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pearn.103.150.190.91.sslip.io;
    ssl_certificate     /home/cuyvps/le/config/live/pearn.103.150.190.91.sslip.io/fullchain.pem;
    ssl_certificate_key /home/cuyvps/le/config/live/pearn.103.150.190.91.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    # A static site: no request bodies.
    client_max_body_size 1k;

    location /.well-known/acme-challenge/ { root /home/cuyvps/acme; }
    location / {
        proxy_pass http://127.0.0.1:3177;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }
}
