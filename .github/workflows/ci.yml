name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    name: JS (lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm check:ci
      - name: Regression index (REGRESSION.md)
        run: node scripts/regressions.mjs
      - name: Repo scripts
        run: pnpm test:scripts

  contracts:
    name: Contracts (fmt, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: forge fmt
        run: forge fmt --check
      - name: forge lint
        run: forge lint -D warnings
      - name: forge build
        run: forge build --sizes
      - name: Web ABI matches the contracts
        run: node ../scripts/abi.mjs && git diff --exit-code ../apps/web/lib/abi.ts
      - name: Unit tests
        run: forge test -vvv --match-path 'test/unit/*'
      - name: Integration tests
        run: forge test -vvv --match-path 'test/integration/*'
      - name: Property tests (fuzz)
        run: forge test -vvv --match-path 'test/property/*'
      - name: Fork tests (real stNEAR on Aurora testnet and mainnet)
        env:
          FOUNDRY_PROFILE: fork
        run: |
          node ../scripts/aurora-rpc.mjs testnet 8546 &
          node ../scripts/aurora-rpc.mjs mainnet 8547 &
          for port in 8546 8547; do
            for _ in $(seq 30); do cast chain-id -r "http://127.0.0.1:$port" && break; sleep 1; done
          done
          forge test -vvv
