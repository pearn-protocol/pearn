name: CI

on:
  pull_request:
  # main is covered by deploy.yml, which calls this workflow before deploying.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    name: JS (lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm check:ci
      - name: Regression index (REGRESSION.md)
        run: node scripts/regressions.mjs
      - name: Repo scripts
        run: pnpm test:scripts

  web:
    name: Web (types, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/foundry
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build (Aurora testnet)
        run: pnpm build
      - name: End to end (anvil + headless Chrome)
        timeout-minutes: 5
        env:
          CHROME: /usr/bin/google-chrome
        run: pnpm e2e

  indexer:
    name: Indexer (types, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/indexer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/foundry
      - run: pnpm install --frozen-lockfile
      - name: Codegen and typecheck
        run: pnpm codegen && pnpm typecheck
      - name: Integration (anvil + DevChain + ponder)
        timeout-minutes: 5
        run: pnpm test

  docs:
    name: Docs (types, links, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Links
        run: pnpm test
      - name: Build
        run: pnpm build

  landing:
    name: Landing (types, unit, build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build and smoke test
        run: pnpm build

  contracts:
    name: Contracts (fmt, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/foundry
      - name: forge fmt
        run: forge fmt --check
      - name: forge lint
        run: forge lint -D warnings
      - name: forge build
        run: forge build --sizes
      - name: Web ABI matches the contracts
        run: node ../scripts/abi.mjs && git diff --exit-code ../packages/abi/index.ts
      - name: Unit tests
        run: forge test -vvv --match-path 'test/unit/*'
      - name: Integration tests
        run: forge test -vvv --match-path 'test/integration/*'
      - name: Property tests (fuzz)
        run: forge test -vvv --match-path 'test/property/*'
      - name: Invariant tests (several markets, random actions)
        run: forge test -vvv --match-path 'test/invariant/*'
      - name: Fork tests (real stNEAR on Aurora testnet and mainnet)
        env:
          FOUNDRY_PROFILE: fork
        run: |
          node ../scripts/aurora-rpc.mjs testnet 8546 &
          node ../scripts/aurora-rpc.mjs mainnet 8547 &
          for port in 8546 8547; do
            for _ in $(seq 30); do cast chain-id -r "http://127.0.0.1:$port" && break; sleep 1; done
          done
          # The public Aurora RPCs time out now and then; one retry keeps that from blocking deploys.
          forge test -vvv || { echo "::warning::fork tests failed once; retrying"; forge test -vvv; }

  sonar:
    name: SonarQube (zero issues)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway SonarQube server per run: no account or token to manage, and the same check
    # runs locally (CONTRIBUTING.md). Any issue or hotspot fails the job.
    services:
      sonarqube:
        image: sonarqube@sha256:1ce197471f5f2bac347694a336862fd2c23e9f57c6edb46acebbfbe70f2c7d9c # 26.11 community
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # blame, so every issue has an author and a date
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The TypeScript analysis follows each tsconfig's `extends` into node_modules.
      - run: pnpm install --frozen-lockfile
      - name: Scan
        run: |
          api=http://localhost:9000/api
          until curl -sf "$api/system/status" | grep -q '"status":"UP"'; do sleep 5; done
          pass="ci-$(openssl rand -hex 16)A1!"
          curl -sf -u admin:admin -X POST "$api/users/change_password" \
            --data-urlencode login=admin --data-urlencode previousPassword=admin --data-urlencode "password=$pass"
          auth="admin:$pass"
          curl -sf -u "$auth" -X POST "$api/projects/create" -d "project=pearn&name=Pearn" >/dev/null
          token=$(curl -sf -u "$auth" -X POST "$api/user_tokens/generate" \
            -d "name=ci&type=PROJECT_ANALYSIS_TOKEN&projectKey=pearn" | jq -r .token)
          echo "::add-mask::$token"
          # As the runner's user, so git trusts the checkout (blame, SCM file list); a fresh /tmp
          # because the image's work directory there belongs to its own user.
          docker run --rm --network host --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,mode=1777 \
            -e SONAR_USER_HOME=/tmp/sonar -e SONAR_HOST_URL=http://localhost:9000 -e "SONAR_TOKEN=$token" \
            -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli@sha256:38207bba3d98c8ce6f6c051ea2b9f05a24480da78c9ee5945ceafc3d9de02b88
          until curl -sf -u "$auth" "$api/ce/component?component=pearn" | jq -e '(.queue | length) == 0 and .current.status == "SUCCESS"' >/dev/null; do sleep 3; done
          issues=$(curl -sf -u "$auth" "$api/issues/search?components=pearn&resolved=false&ps=500")
          hotspots=$(curl -sf -u "$auth" "$api/measures/component?component=pearn&metricKeys=security_hotspots" \
            | jq -r '.component.measures[0].value')
          gate=$(curl -sf -u "$auth" "$api/qualitygates/project_status?projectKey=pearn" | jq -r .projectStatus.status)
          echo "$issues" | jq -r '.issues[] | "::error file=\(.component | sub("^pearn:"; "")),line=\(.line // 1)::\(.rule): \(.message)"'
          echo "issues $(echo "$issues" | jq .total), hotspots $hotspots, quality gate $gate"
          [ "$(echo "$issues" | jq .total)" = 0 ] && [ "$hotspots" = 0 ] && [ "$gate" = OK ]
