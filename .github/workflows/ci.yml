name: CI

on:
  pull_request:
  # main is covered by deploy.yml, which calls this workflow before deploying.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    name: JS (lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm check:ci
      - name: Regression index (REGRESSION.md)
        run: node scripts/regressions.mjs
      - name: Repo scripts
        run: pnpm test:scripts

  web:
    name: Web (types, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build (Aurora testnet)
        run: pnpm build
      - name: End to end (anvil + headless Chrome)
        timeout-minutes: 5
        env:
          CHROME: /usr/bin/google-chrome
        run: pnpm e2e

  indexer:
    name: Indexer (types, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/indexer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: pnpm install --frozen-lockfile
      - name: Codegen and typecheck
        run: pnpm codegen && pnpm typecheck
      - name: Integration (anvil + DevChain + ponder)
        timeout-minutes: 5
        run: pnpm test

  contracts:
    name: Contracts (fmt, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: forge fmt
        run: forge fmt --check
      - name: forge lint
        run: forge lint -D warnings
      - name: forge build
        run: forge build --sizes
      - name: Web ABI matches the contracts
        run: node ../scripts/abi.mjs && git diff --exit-code ../packages/abi/index.ts
      - name: Unit tests
        run: forge test -vvv --match-path 'test/unit/*'
      - name: Integration tests
        run: forge test -vvv --match-path 'test/integration/*'
      - name: Property tests (fuzz)
        run: forge test -vvv --match-path 'test/property/*'
      - name: Fork tests (real stNEAR on Aurora testnet and mainnet)
        env:
          FOUNDRY_PROFILE: fork
        run: |
          node ../scripts/aurora-rpc.mjs testnet 8546 &
          node ../scripts/aurora-rpc.mjs mainnet 8547 &
          for port in 8546 8547; do
            for _ in $(seq 30); do cast chain-id -r "http://127.0.0.1:$port" && break; sleep 1; done
          done
          forge test -vvv
