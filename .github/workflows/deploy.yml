name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  coolify:
    name: Coolify (web, indexer, docs)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_WEB_UUID: ${{ vars.COOLIFY_WEB_UUID }}
      COOLIFY_INDEXER_UUID: ${{ vars.COOLIFY_INDEXER_UUID }}
      COOLIFY_DOCS_UUID: ${{ vars.COOLIFY_DOCS_UUID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which images changed?
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          shared='package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.dockerignore$|packages/abi/'
          # A manual run, a new branch or a force-push past history rebuilds everything.
          if [ "${{ github.event_name }}" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            web=true indexer=true docs=true
          else
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            web=false indexer=false docs=false
            echo "$files" | grep -qE "^(apps/web/|packages/brand/|deploy/static/|$shared)" && web=true
            echo "$files" | grep -qE "^(apps/indexer/|contracts/deployments/|$shared)" && indexer=true
            echo "$files" | grep -qE "^(apps/docs/|packages/brand/|deploy/static/|$shared)" && docs=true
          fi
          echo "web=$web" >>"$GITHUB_OUTPUT"
          echo "indexer=$indexer" >>"$GITHUB_OUTPUT"
          echo "docs=$docs" >>"$GITHUB_OUTPUT"
          echo "rebuild web: $web, indexer: $indexer, docs: $docs"
      - name: Trigger the deploys
        env:
          WEB: ${{ steps.pick.outputs.web }}
          INDEXER: ${{ steps.pick.outputs.indexer }}
          DOCS: ${{ steps.pick.outputs.docs }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_URL" ]; then
            echo "::warning::COOLIFY_URL or COOLIFY_TOKEN is not set; skipping deploy."
            exit 0
          fi
          deploy() {
            if [ -z "$2" ]; then echo "::warning::no Coolify uuid for $1; skipping."; return; fi
            code=$(curl -s -o /tmp/deploy.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$2")
            if [ "$code" != "200" ]; then
              echo "::error::deploy $1 failed with HTTP $code"
              exit 1
            fi
            echo "queued $1"
          }
          [ "$WEB" = true ] && deploy web "$COOLIFY_WEB_UUID"
          [ "$INDEXER" = true ] && deploy indexer "$COOLIFY_INDEXER_UUID"
          [ "$DOCS" = true ] && deploy docs "$COOLIFY_DOCS_UUID"
          exit 0
