name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  coolify:
    name: Coolify (web)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_WEB_UUID: ${{ vars.COOLIFY_WEB_UUID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the web image change?
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A manual run, a new branch or a force-push past history always rebuilds.
          if [ "${{ github.event_name }}" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            web=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" \
            | grep -qE '^(apps/web/|packages/brand/|deploy/static/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.dockerignore$)'; then
            web=true
          else
            web=false
          fi
          echo "web=$web" >>"$GITHUB_OUTPUT"
          echo "rebuild web: $web"
      - name: Trigger the deploy
        if: steps.pick.outputs.web == 'true'
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_WEB_UUID" ]; then
            echo "::warning::COOLIFY_URL, COOLIFY_TOKEN or COOLIFY_WEB_UUID is not set; skipping deploy."
            exit 0
          fi
          code=$(curl -s -o /tmp/deploy.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_WEB_UUID")
          if [ "$code" != "200" ]; then
            echo "::error::deploy failed with HTTP $code"
            exit 1
          fi
          echo "queued web"
