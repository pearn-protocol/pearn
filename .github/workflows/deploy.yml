name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  coolify:
    name: Coolify (landing, web, indexer, docs)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      # To find the last successful deploy.
      actions: read
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_WEB_UUID: ${{ vars.COOLIFY_WEB_UUID }}
      COOLIFY_INDEXER_UUID: ${{ vars.COOLIFY_INDEXER_UUID }}
      COOLIFY_DOCS_UUID: ${{ vars.COOLIFY_DOCS_UUID }}
      COOLIFY_LANDING_UUID: ${{ vars.COOLIFY_LANDING_UUID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which images changed?
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shared='package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.dockerignore$|packages/abi/'
          # Diff against the last deploy that succeeded, not the previous push: a push whose CI
          # failed, or a run superseded in the queue, must not leave its changes undeployed.
          base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success \
            --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)
          # A manual run, no earlier success, or a base outside history rebuilds everything.
          if [ "${{ github.event_name }}" != push ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            web=true indexer=true docs=true landing=true
          else
            echo "changes since $base"
            files=$(git diff --name-only "$base" "$GITHUB_SHA")
            web=false indexer=false docs=false landing=false
            echo "$files" | grep -qE "^(apps/web/|packages/brand/|deploy/static/|$shared)" && web=true
            echo "$files" | grep -qE "^(apps/indexer/|contracts/deployments/|$shared)" && indexer=true
            echo "$files" | grep -qE "^(apps/docs/|packages/brand/|deploy/static/|$shared)" && docs=true
            echo "$files" | grep -qE "^(apps/landing/|packages/brand/|deploy/static/|$shared)" && landing=true
          fi
          echo "web=$web" >>"$GITHUB_OUTPUT"
          echo "indexer=$indexer" >>"$GITHUB_OUTPUT"
          echo "docs=$docs" >>"$GITHUB_OUTPUT"
          echo "landing=$landing" >>"$GITHUB_OUTPUT"
          echo "rebuild web: $web, indexer: $indexer, docs: $docs, landing: $landing"
      - name: Trigger the deploys
        env:
          WEB: ${{ steps.pick.outputs.web }}
          INDEXER: ${{ steps.pick.outputs.indexer }}
          DOCS: ${{ steps.pick.outputs.docs }}
          LANDING: ${{ steps.pick.outputs.landing }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_URL" ]; then
            echo "::error::COOLIFY_URL or COOLIFY_TOKEN is not set."
            exit 1
          fi
          deploy() {
            if [ -z "$2" ]; then echo "::error::no Coolify uuid for $1"; exit 1; fi
            code=$(curl -s -o /tmp/deploy.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$2")
            if [ "$code" != "200" ]; then
              echo "::error::deploy $1 failed with HTTP $code"
              exit 1
            fi
            echo "queued $1"
          }
          [ "$WEB" = true ] && deploy web "$COOLIFY_WEB_UUID"
          [ "$INDEXER" = true ] && deploy indexer "$COOLIFY_INDEXER_UUID"
          [ "$DOCS" = true ] && deploy docs "$COOLIFY_DOCS_UUID"
          [ "$LANDING" = true ] && deploy landing "$COOLIFY_LANDING_UUID"
          exit 0
