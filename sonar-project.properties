# SonarQube analysis of the whole monorepo (see CONTRIBUTING.md). Solidity is checked by forge fmt
# and the Foundry tests; SonarQube community covers the TypeScript, JavaScript, CSS, Docker and CI.
sonar.projectKey=pearn
sonar.projectName=Pearn
sonar.sources=apps,packages,scripts,deploy,.github,contracts/script,contracts/src
sonar.tests=contracts/test
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/dist/**,**/.astro/**,**/.source/**,**/public/**,**/*.mp4,**/*.png,**/*.jpg,**/*.ico,**/*.svg,**/*.woff2,apps/video/footage/**,apps/video/voice/**,apps/indexer/.ponder/**,apps/indexer/generated/**,apps/docs/content/**,packages/abi/index.ts
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs,**/e2e/**,contracts/test/**
sonar.sourceEncoding=UTF-8

# S4036 (command resolved through PATH): these scripts run cast, forge, anvil, ffmpeg, sips and
# pnpm on a developer machine or a CI runner, whose PATH is trusted, and the tools live in
# different places on each (~/.foundry/bin, $RUNNER_TEMP/foundry, Homebrew). Node itself is
# started as process.execPath. Nothing in the deployed apps spawns a process.
sonar.issue.ignore.multicriteria=path
sonar.issue.ignore.multicriteria.path.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.path.resourceKey=**/scripts/**
