packages:
  - "apps/*"
  - "packages/*"

# Security patches for ponder's pinned dependencies (pnpm audit). Drop each once ponder ships it.
# Left open: @hono/node-server <2.1.3 (serveStatic path decoding); ponder never uses serveStatic.
overrides:
  "@hono/node-server": ^1.19.15
  "@graphql-tools/utils": ^12.0.2
  "drizzle-orm@<0.45.2": ^0.45.2
  "vite@>=8.3.0 <8.3.3": ^8.3.3
  "glob@>=9.0.0 <14.0.2": ^14.0.2
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
  # Tailwind pins lightningcss 1.32, which warns on fumadocs' valid ::highlight() rules.
  "lightningcss@1.32.0": 1.33.0

# prom-client is deprecated for @prometheus-io/client, but ponder (latest included) still uses it,
# and the replacement has another API. Drop this once ponder moves.
allowedDeprecatedVersions:
  prom-client: 15.1.3
